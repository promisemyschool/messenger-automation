services:
  # Optional TLS reverse proxy. Skip when using Nginx Proxy Manager (see docs/nginx-proxy-manager.md).
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - n8n

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_PORT: ${N8N_PORT}
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
      # Read FAQ node (n8n 2.x restricts disk access by default)
      N8N_RESTRICT_FILE_ACCESS_TO: ${N8N_RESTRICT_FILE_ACCESS_TO:-/knowledge}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      GENERIC_TIMEZONE: Asia/Dhaka
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      SITE_URL: ${SITE_URL}
      HOBBYCAMP_URL: ${HOBBYCAMP_URL}
      ESCALATION_NOTIFY_EMAIL: ${ESCALATION_NOTIFY_EMAIL}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./knowledge:/knowledge:ro
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Keep model loaded between Messenger replies (reduces first-token delay)
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  caddy_data:
  caddy_config:
  n8n_data:
  ollama_data:
